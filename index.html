<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>मेंटर – आपका AI असिस्टेंट</title>
<style>
:root{--bg:#faf8f5;--surface:#ffffff;--text:#1f1d1a;--muted:#6b665f;--accent:#c4552d;--accent-text:#ffffff;--border:#e6e1d9;--bot:#f0ece5;--gold:#b8860b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1816;--surface:#242120;--text:#f1ede6;--muted:#a39d94;--accent:#e0714a;--accent-text:#1a1816;--border:#38342f;--bot:#2d2926;--gold:#e6b83d}}
:root[data-theme="dark"]{--bg:#1a1816;--surface:#242120;--text:#f1ede6;--muted:#a39d94;--accent:#e0714a;--accent-text:#1a1816;--border:#38342f;--bot:#2d2926;--gold:#e6b83d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;position:relative;overflow:hidden}
header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ib{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.title{flex:1;min-width:0}
.title h1{font-size:17px;margin:0}
.title p{margin:0;font-size:11px;color:var(--muted)}
.mode{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:transparent;color:var(--muted);padding:7px 10px;font-size:12px;cursor:pointer}
.mode button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.mode button.on.pro{background:var(--gold);color:#1a1816}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.w{display:flex;flex-direction:column;max-width:86%}
.w.u{align-self:flex-end;align-items:flex-end}
.m{padding:10px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.u .m{background:var(--accent);color:var(--accent-text);border-bottom-right-radius:4px}
.b .m{background:var(--bot);border-bottom-left-radius:4px}
.t{font-size:11px;color:var(--muted);margin:3px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;max-height:120px}
button.send{border:0;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.5}
#drawer{position:absolute;inset:0 30% 0 0;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .2s;z-index:5;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;z-index:4}
#shade.open{display:block}
#drawer h2{font-size:15px;margin:0;padding:14px}
#list{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--border);cursor:pointer;font-size:14px}
.row.cur{background:var(--bot)}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.empty{padding:14px;color:var(--muted);font-size:13px}
#proNote{display:none;font-size:12px;color:var(--gold);text-align:center;padding:4px 12px}
.bar{display:flex;justify-content:flex-end;padding:8px 12px 0}
</style>
</head>
<body>
<div id="app">
<div id="shade"></div>
<aside id="drawer"><h2 id="dh">पुरानी चैट्स</h2><div id="list"></div></aside>
<header>
<button class="ib" id="menu" aria-label="हिस्ट्री">☰</button>
<div class="title"><h1 id="h1">मेंटर</h1><p id="sub">⚡ झटपट जवाब</p></div>
<div class="mode"><button id="mFast" class="on">⚡ तेज़</button><button id="mPro" class="pro">⭐ प्रीमियम</button></div>
<button class="ib" id="newc" aria-label="नई चैट">＋</button>
</header>
<div class="bar"><div class="mode"><button id="lHi">हिंदी</button><button id="lEn">English</button></div></div>
<div id="proNote"></div>
<div id="msgs"></div>
<div class="chips" id="chips"></div>
<footer>
<textarea id="inp" rows="1" placeholder="कुछ भी पूछिए…"></textarea>
<button class="send" id="go">भेजें</button>
</footer>
</div>
<script>
const SYS = "तुम \u201Cमेंटर\u201D हो, एक दोस्ताना और समझदार AI असिस्टेंट। यूज़र जिस भाषा में लिखे (हिंदी, अंग्रेज़ी या हिंग्लिश), उसी में जवाब दो। जवाब छोटे, सीधे और काम के रखो: पहले सीधा उत्तर, फिर ज़रूरत हो तो 2-3 लाइन का विवरण। हर विषय में मदद करो। अगर कुछ पक्का पता न हो तो साफ़ बता दो। मेडिकल, कानूनी या पैसों के बड़े फ़ैसलों में याद दिलाओ कि विशेषज्ञ से भी सलाह लें।";
const SYS_PRO = SYS + " प्रीमियम मोड: ज़्यादा गहराई से सोचो, ज़रूरत हो तो स्टेप-बाय-स्टेप और ज़्यादा विस्तृत जवाब दो।";
const SYS_EN = "You are \u201CMentor\u201D, a friendly, smart AI assistant. Reply in English only, never in Hindi or any other language, even if the user writes in another language. Keep answers short, direct and useful: lead with the direct answer, then 2-3 lines of detail if needed. Help with any topic. If you are unsure, say so. For medical, legal or big money decisions, remind the user to consult an expert too.";
const SYS_EN_PRO = SYS_EN + " Premium mode: think more deeply and give step-by-step, more detailed answers when useful.";
const L = {
 hi:{h1:"मेंटर",sub1:"⚡ झटपट जवाब",sub2:"⭐ प्रीमियम: गहरा सोचकर",fast:"⚡ तेज़",pro:"⭐ प्रीमियम",note:"प्रीमियम मोड: ज़्यादा गहरा सोचकर जवाब, थोड़ा ज़्यादा समय लग सकता है।",ph:"कुछ भी पूछिए…",send:"भेजें",dh:"पुरानी चैट्स",empty:"अभी कोई चैट नहीं है।",greet:"नमस्ते! मैं मेंटर हूँ। पढ़ाई, काम, कोडिंग, लिखना या रोज़ की कोई भी बात, पूछिए। हर जवाब के नीचे मैं बताऊँगा कि कितना समय लगा।",chips:["मुझे एक अच्छा बायोडाटा कैसे बनाना चाहिए?","5 मिनट में कोई नई स्किल कैसे सीखें?","मेरे लिए एक छोटा ईमेल लिख दो"],thinking:"सोच रहा हूँ…",took:"जवाब में लगा: ",ms:" मि.से.",sec:" सेकंड",noconn:"शुरू करने के लिए ☰ मेन्यू में अपनी Anthropic API key डालें।",rate:"थोड़ी देर रुककर फिर पूछिए।",err:"कुछ गड़बड़ हो गई। कृपया दोबारा कोशिश करें।",del:"हटाएँ",hist:"हिस्ट्री",newa:"नई चैट"},
 en:{h1:"Mentor",sub1:"⚡ Instant answers",sub2:"⭐ Premium: deeper thinking",fast:"⚡ Fast",pro:"⭐ Premium",note:"Premium mode: thinks deeper, so replies may take a little longer.",ph:"Ask me anything…",send:"Send",dh:"Chat history",empty:"No chats yet.",greet:"Hello! I’m Mentor. Ask me about studies, work, coding, writing or anything else. Under every reply I’ll show how long it took.",chips:["How do I write a good résumé?","How can I learn a new skill in 5 minutes?","Write me a short email"],thinking:"Thinking…",took:"Answered in: ",ms:" ms",sec:" sec",noconn:"To start, add your Anthropic API key in the ☰ menu.",rate:"Please wait a moment and try again.",err:"Something went wrong. Please try again.",del:"Delete",hist:"History",newa:"New chat"}
};
let lang = "hi";
const T = k => L[lang][k];
const $ = id => document.getElementById(id);
const msgs = $("msgs"), inp = $("inp"), go = $("go"), chips = $("chips");
let chats = [], cur = null, sample = null, busy = false, mode = "fast";

function load(){ try { chats = JSON.parse(localStorage.getItem("mentor_chats") || "[]"); } catch(e){ chats = []; } }
function save(){ try { localStorage.setItem("mentor_chats", JSON.stringify(chats.slice(0,50))); } catch(e){} }
function fmt(ms){ return ms < 1000 ? ms + T("ms") : (ms/1000).toFixed(1) + T("sec"); }

function bubble(role, text, ms, pro){
  const w = document.createElement("div"); w.className = "w " + (role === "user" ? "u" : "b");
  const m = document.createElement("div"); m.className = "m"; m.textContent = text; w.appendChild(m);
  if (ms != null){ const t = document.createElement("div"); t.className = "t"; t.textContent = (pro ? "⭐ " : "⚡ ") + T("took") + fmt(ms); w.appendChild(t); }
  msgs.appendChild(w); msgs.scrollTop = msgs.scrollHeight;
  return {m, w};
}
function render(){
  msgs.innerHTML = "";
  if (!cur || !cur.msgs.length){
    bubble("assistant", T("greet"));
    chips.style.display = "flex";
  } else {
    chips.style.display = "none";
    cur.msgs.forEach(x => bubble(x.role, x.content, x.ms, x.pro));
  }
  renderList();
}
function renderList(){
  const l = $("list"); l.innerHTML = "";
  if (!chats.length){ l.innerHTML = ''; const e0 = document.createElement("div"); e0.className = "empty"; e0.textContent = T("empty"); l.appendChild(e0); return; }
  chats.forEach(c => {
    const r = document.createElement("div"); r.className = "row" + (cur && c.id === cur.id ? " cur" : "");
    const s = document.createElement("span"); s.textContent = c.title; r.appendChild(s);
    const d = document.createElement("button"); d.textContent = "🗑"; d.setAttribute("aria-label", T("del"));
    d.onclick = e => { e.stopPropagation(); chats = chats.filter(x => x.id !== c.id); save(); if (cur && cur.id === c.id) newChat(); else renderList(); };
    r.appendChild(d);
    r.onclick = () => { if (busy) return; cur = c; render(); closeDrawer(); };
    l.appendChild(r);
  });
}
function newChat(){ if (busy) return; cur = {id: Date.now(), title: "नई चैट", msgs: []}; render(); closeDrawer(); }
function openDrawer(){ $("drawer").classList.add("open"); $("shade").classList.add("open"); }
function closeDrawer(){ $("drawer").classList.remove("open"); $("shade").classList.remove("open"); }
function setMode(m){
  mode = m; const pro = m === "pro";
  $("mFast").classList.toggle("on", !pro); $("mPro").classList.toggle("on", pro);
  $("sub").textContent = pro ? T("sub2") : T("sub1");
  $("proNote").style.display = pro ? "block" : "none";
}
$("menu").onclick = openDrawer; $("shade").onclick = closeDrawer; $("newc").onclick = newChat;
$("mFast").onclick = () => setMode("fast"); $("mPro").onclick = () => setMode("pro");

function buildChips(){ chips.innerHTML = ""; T("chips").forEach(t => {
  const c = document.createElement("button"); c.className = "chip"; c.textContent = t;
  c.onclick = () => { inp.value = t; send(); }; chips.appendChild(c);
}); }

function getKey(){ try { return localStorage.getItem("mentor_key") || ""; } catch(e){ return ""; } }
sample = async (payload, opts) => {
  const pro = opts && opts.modelTier === "complex";
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model: pro ? "claude-sonnet-5-5" : "claude-haiku-5-5", max_tokens: pro ? 2000 : 1000, messages: payload})
  });
  if (!r.ok) { const e = new Error("api"); e.code = r.status === 429 ? "rate_limited" : "api"; throw e; }
  const d = await r.json();
  const text = (d.content || []).map(x => x.text || "").join("");
  if (opts && opts.onText) opts.onText({text});
  return {text};
};
const keyIn = document.createElement("input");
keyIn.id = "keyIn"; keyIn.type = "password"; keyIn.placeholder = "Anthropic API key (sk-ant-...)"; keyIn.value = getKey();
keyIn.style.cssText = "margin:10px 14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:13px";
keyIn.onchange = () => { try { localStorage.setItem("mentor_key", keyIn.value.trim()); } catch(e){} };
$("drawer").appendChild(keyIn);

async function send(){
  const text = inp.value.trim();
  if (!text || busy) return;
  if (!getKey()){ openDrawer(); keyIn.focus(); bubble("assistant", T("noconn")); return; }
  busy = true; go.disabled = true; chips.style.display = "none";
  inp.value = ""; inp.style.height = "auto";
  if (!chats.includes(cur)){ chats.unshift(cur); }
  if (!cur.msgs.length){ cur.title = text.slice(0, 40); msgs.innerHTML = ""; }
  const pro = mode === "pro";
  cur.msgs.push({role:"user", content:text}); bubble("user", text);
  const sys = lang === "en" ? (pro ? SYS_EN_PRO : SYS_EN) : (pro ? SYS_PRO : SYS);
  const payload = cur.msgs.map((m,i) => ({role:m.role, content: i === 0 ? sys + "\n\n---\nयूज़र का संदेश:\n" + m.content : m.content}));
  const b = bubble("assistant", T("thinking"));
  const t0 = performance.now();
  try {
    const r = await sample(payload, {cache:false, modelTier: pro ? "complex" : "quick", onText: ({text:t}) => { b.m.textContent = t; msgs.scrollTop = msgs.scrollHeight; }});
    const ms = Math.round(performance.now() - t0);
    b.m.textContent = r.text;
    const t = document.createElement("div"); t.className = "t"; t.textContent = (pro ? "⭐ " : "⚡ ") + T("took") + fmt(ms); b.w.appendChild(t);
    cur.msgs.push({role:"assistant", content:r.text, ms, pro});
  } catch(e){
    cur.msgs.pop();
    b.m.textContent = (e && e.code === "rate_limited") ? T("rate") : T("err");
  }
  save(); renderList(); busy = false; go.disabled = false; inp.focus();
}
go.onclick = send;
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 120) + "px"; });
function applyLang(){
  document.documentElement.lang = lang;
  $("h1").textContent = T("h1"); $("mFast").textContent = T("fast"); $("mPro").textContent = T("pro");
  $("proNote").textContent = T("note"); inp.placeholder = T("ph"); go.textContent = T("send"); $("dh").textContent = T("dh");
  $("menu").setAttribute("aria-label", T("hist")); $("newc").setAttribute("aria-label", T("newa"));
  $("lHi").classList.toggle("on", lang === "hi"); $("lEn").classList.toggle("on", lang === "en");
  buildChips(); setMode(mode); render();
}
function setLang(l){ lang = l; try { localStorage.setItem("mentor_lang", l); } catch(e){} applyLang(); }
$("lHi").onclick = () => setLang("hi"); $("lEn").onclick = () => setLang("en");
load();
try { const sl = localStorage.getItem("mentor_lang"); if (sl === "en" || sl === "hi") lang = sl; } catch(e){}
cur = {id: Date.now(), title: "New chat", msgs: []}; applyLang();
</script>
</body>
</html>
